      --bootnodes enode://ca2774c3c401325850b2477fd7d0f27911efbf79b1e8b335066516e2bd8c4c9e0ba9696a94b1cb030a88eac582305ff55e905e64fb77fe0edcd70a4e5296d3ec@34.65.175.185:30305,enode://dd751a9ef8912be1bfa7a5e34e2c3785cc5253110bd929f385e07ba7ac19929fb0e0c5d93f77827291f4da02b2232240fbc47ea7ce04c46e333e452f8656b667@34.65.107.0:30305,enode://c5d289b56a77b6a2342ca29956dfd07aadf45364dde8ab20d1dc4efd4d1bc6b4655d902501daea308f4d8950737a4e93a4dfedd17b49cd5760ffd127837ca965@34.65.202.239:30305,enode://87a32fd13bd596b2ffca97020e31aef4ddcc1bbd4b95bb633d16c1329f654f34049ed240a36b449fda5e5225d70fe40bc667f53c304b71f8e68fc9d448690b51@3.231.138.188:30301,enode://ca21ea8f176adb2e229ce2d700830c844af0ea941a1d8152a9513b966fe525e809c3a6c73a2c18a12b74ed6ec4380edf91662778fe0b79f6a591236e49e176f9@184.72.129.189:30301,enode://acf4507a211ba7c1e52cdf4eef62cdc3c32e7c9c47998954f7ba024026f9a6b2150cd3f0b734d9c78e507ab70d59ba61dfe5c45e1078c7ad0775fb251d7735a2@3.220.145.177:30301,enode://8a5a5006159bf079d06a04e5eceab2a1ce6e0f721875b2a9c96905336219dbe14203d38f70f3754686a6324f786c2f9852d8c0dd3adac2d080f4db35efc678c5@3.231.11.52:30301,enode://cdadbe835308ad3557f9a1de8db411da1a260a98f8421d62da90e71da66e55e98aaa8e90aa7ce01b408a54e4bd2253d701218081ded3dbe5efbbc7b41d7cef79@54.198.153.150:30301,enode://b1a743328188dba3b2ed8c06abbb2688fabe64a3251e43bd77d4e5265bbd5cf03eca8ace4cde8ddb0c49c409b90bf941ebf556094638c6203edd6baa5ef0091b@3.134.214.169:30303,enode://ea9eaaf695facbe53090beb7a5b0411a81459bbf6e6caac151e587ee77120a1b07f3b9f3a9550f797d73d69840a643b775fd1e40344dea11e7660b6a483fe80e@52.14.30.39:30303,enode://77b6b1e72984d5d50e00ae934ffea982902226fe92fa50da42334c2750d8e405b55a5baabeb988c88125368142a64eda5096d0d4522d3b6eef75d166c7d303a9@3.148.100.173:30303
      --rollup.sequencer https://mainnet-sequencer.unichain.org
      --rollup.disable-tx-pool-gossip
    volumes:
      - ${DATA_DIR:-./data}/unichain-mainnet:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - ${RPC_BIND:-127.0.0.1}:8546:8545
      - 30304:30304/tcp
      - 30304:30304/udp

  mainnet-supernode:
    <<: *supernode
    profiles: [mainnet]
    depends_on: [op-mainnet-reth, unichain-mainnet-reth]
    command:
      - --chains=10,130
      - --data-dir=/data
      - --l1=${L1_MAINNET_RPC}
      - --l1.beacon=${L1_MAINNET_BEACON}
      - --rpc.port=8545
      - --vn.all.l2.jwt-secret=/jwt/jwt.hex
      # syncmode must be set per chain; --vn.all.syncmode is ignored.
      - --vn.10.network=op-mainnet
      - --vn.10.syncmode=execution-layer
      - --vn.10.l2=http://op-mainnet-reth:8551
      - --vn.10.p2p.listen.tcp=9222
      - --vn.10.p2p.listen.udp=9222
      - --vn.130.network=unichain-mainnet
      - --vn.130.syncmode=execution-layer
      - --vn.130.l2=http://unichain-mainnet-reth:8551
      - --vn.130.p2p.listen.tcp=9223
      - --vn.130.p2p.listen.udp=9223
    volumes:
      - ${DATA_DIR:-./data}/mainnet-supernode:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - ${RPC_BIND:-127.0.0.1}:9545:8545
      - 9222:9222/tcp
      - 9222:9222/udp
      - 9223:9223/tcp
      - 9223:9223/udp

  # ---------------------------------------------------------------- sepolia

