# OP Mainnet + Unichain (profile: mainnet) and OP Sepolia + Unichain Sepolia (profile: sepolia).
# Each network runs one op-supernode (consensus for both chains) and one op-reth per chain.
# Settings live in .env; see .env.example.

x-reth: &reth
  image: ${OP_RETH_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.8.0}
  restart: unless-stopped
  stop_grace_period: 5m
  logging: {driver: local}
  depends_on:
    jwt:
      condition: service_completed_successfully

x-supernode: &supernode
  image: ${OP_SUPERNODE_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-supernode:v1.1.0}
  entrypoint: [op-supernode]
  restart: unless-stopped
  stop_grace_period: 2m
  logging: {driver: local}

services:
  # Writes a shared engine API secret on first start.
  jwt:
    image: alpine:3.22
    command: sh -c 'umask 077; [ -s /jwt/jwt.hex ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > /jwt/jwt.hex'
    volumes:
      - ${DATA_DIR:-./data}/jwt:/jwt

  # ---------------------------------------------------------------- mainnet

  op-mainnet-reth:
    <<: *reth
    profiles: [mainnet]
    command: >
      node --chain optimism --datadir /data --color never
      ${RETH_HISTORY---full --prune.receipts.distance 1209600}
      --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,txpool,debug,trace
      --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api eth,net,web3
      --authrpc.addr 0.0.0.0 --authrpc.port 8551 --authrpc.jwtsecret /jwt/jwt.hex
      --port 30303 --discovery.v5.port 30303
      --metrics 0.0.0.0:9001
      --rollup.sequencer https://mainnet-sequencer.optimism.io
      --rollup.disable-tx-pool-gossip
    volumes:
      - ${DATA_DIR:-./data}/op-mainnet:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - ${RPC_BIND:-127.0.0.1}:8545:8545
      - ${RPC_BIND:-127.0.0.1}:8645:8546
      - 127.0.0.1:9001:9001
      - 30303:30303/tcp
      - 30303:30303/udp

  unichain-mainnet-reth:
    <<: *reth
    profiles: [mainnet]
    command: >
      node --chain unichain --datadir /data --color never
      ${RETH_HISTORY---full --prune.receipts.distance 1209600}
      --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,txpool,debug,trace
      --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api eth,net,web3
      --authrpc.addr 0.0.0.0 --authrpc.port 8551 --authrpc.jwtsecret /jwt/jwt.hex
      --port 30304 --discovery.v5.port 30304
      --metrics 0.0.0.0:9001
      --rollup.sequencer https://mainnet-sequencer.unichain.org
      --rollup.disable-tx-pool-gossip
    volumes:
      - ${DATA_DIR:-./data}/unichain-mainnet:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - ${RPC_BIND:-127.0.0.1}:8546:8545
      - ${RPC_BIND:-127.0.0.1}:8646:8546
      - 127.0.0.1:9002:9001
      - 30304:30304/tcp
      - 30304:30304/udp

  mainnet-supernode:
    <<: *supernode
    profiles: [mainnet]
    depends_on: [op-mainnet-reth, unichain-mainnet-reth]
    command:
      - --chains=10,130
      - --data-dir=/data
      - --l1=${L1_MAINNET_RPC}
      - --l1.beacon=${L1_MAINNET_BEACON}
      - --rpc.port=8545
      - --metrics.enabled
      - --vn.all.l2.jwt-secret=/jwt/jwt.hex
      # syncmode must be set per chain; --vn.all.syncmode is ignored.
      - --vn.10.network=op-mainnet
      - --vn.10.syncmode=execution-layer
      - --vn.10.l2=http://op-mainnet-reth:8551
      - --vn.10.p2p.listen.tcp=9222
      - --vn.10.p2p.listen.udp=9222
      - --vn.130.network=unichain-mainnet
      - --vn.130.syncmode=execution-layer
      - --vn.130.l2=http://unichain-mainnet-reth:8551
      - --vn.130.p2p.listen.tcp=9223
      - --vn.130.p2p.listen.udp=9223
    volumes:
      - ${DATA_DIR:-./data}/mainnet-supernode:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - 127.0.0.1:9545:8545
      - 127.0.0.1:7300:7300
      - 9222:9222/tcp
      - 9222:9222/udp
      - 9223:9223/tcp
      - 9223:9223/udp

  # ---------------------------------------------------------------- sepolia

  op-sepolia-reth:
    <<: *reth
    profiles: [sepolia]
    command: >
      node --chain op-sepolia --datadir /data --color never
      ${RETH_HISTORY---full --prune.receipts.distance 1209600}
      --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,txpool,debug,trace
      --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api eth,net,web3
      --authrpc.addr 0.0.0.0 --authrpc.port 8551 --authrpc.jwtsecret /jwt/jwt.hex
      --port 30305 --discovery.v5.port 30305
      --metrics 0.0.0.0:9001
      --rollup.sequencer https://sepolia-sequencer.optimism.io
      --rollup.disable-tx-pool-gossip
    volumes:
      - ${DATA_DIR:-./data}/op-sepolia:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - ${RPC_BIND:-127.0.0.1}:8547:8545
      - ${RPC_BIND:-127.0.0.1}:8647:8546
      - 127.0.0.1:9003:9001
      - 30305:30305/tcp
      - 30305:30305/udp

  unichain-sepolia-reth:
    <<: *reth
    profiles: [sepolia]
    command: >
      node --chain unichain-sepolia --datadir /data --color never
      ${RETH_HISTORY---full --prune.receipts.distance 1209600}
      --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,txpool,debug,trace
      --ws --ws.addr 0.0.0.0 --ws.port 8546 --ws.api eth,net,web3
      --authrpc.addr 0.0.0.0 --authrpc.port 8551 --authrpc.jwtsecret /jwt/jwt.hex
      --port 30306 --discovery.v5.port 30306
      --metrics 0.0.0.0:9001
      --rollup.sequencer https://sepolia-sequencer.unichain.org
      --rollup.disable-tx-pool-gossip
    volumes:
      - ${DATA_DIR:-./data}/unichain-sepolia:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - ${RPC_BIND:-127.0.0.1}:8548:8545
      - ${RPC_BIND:-127.0.0.1}:8648:8546
      - 127.0.0.1:9004:9001
      - 30306:30306/tcp
      - 30306:30306/udp

  sepolia-supernode:
    <<: *supernode
    profiles: [sepolia]
    depends_on: [op-sepolia-reth, unichain-sepolia-reth]
    command:
      - --chains=11155420,1301
      - --data-dir=/data
      - --l1=${L1_SEPOLIA_RPC}
      - --l1.beacon=${L1_SEPOLIA_BEACON}
      - --rpc.port=8545
      - --metrics.enabled
      - --vn.all.l2.jwt-secret=/jwt/jwt.hex
      # syncmode must be set per chain; --vn.all.syncmode is ignored.
      - --vn.11155420.network=op-sepolia
      - --vn.11155420.syncmode=execution-layer
      - --vn.11155420.l2=http://op-sepolia-reth:8551
      - --vn.11155420.p2p.listen.tcp=9224
      - --vn.11155420.p2p.listen.udp=9224
      - --vn.1301.network=unichain-sepolia
      - --vn.1301.syncmode=execution-layer
      - --vn.1301.l2=http://unichain-sepolia-reth:8551
      - --vn.1301.p2p.listen.tcp=9225
      - --vn.1301.p2p.listen.udp=9225
    volumes:
      - ${DATA_DIR:-./data}/sepolia-supernode:/data
      - ${DATA_DIR:-./data}/jwt:/jwt:ro
    ports:
      - 127.0.0.1:9546:8545
      - 127.0.0.1:7301:7300
      - 9224:9224/tcp
      - 9224:9224/udp
      - 9225:9225/tcp
      - 9225:9225/udp
