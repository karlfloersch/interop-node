    <<: *reth
    profiles: [mainnet]
    command: >
      node --chain unichain --full --datadir /data
      --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,txpool
      --authrpc.addr 0.0.0.0 --authrpc.port 8551 --authrpc.jwtsecret /jwt/jwt.hex
