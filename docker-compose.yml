# OP Mainnet + Unichain (profile: mainnet) and OP Sepolia + Unichain Sepolia (profile: sepolia).
# Each network runs one op-supernode (consensus for both chains) and one op-reth per chain.

# op-reth's built-in bootnodes don't find peers for these chains, so each EL lists them explicitly
# (from op-geth and github.com/Uniswap/unichain-node).
x-reth: &reth
  image: ${OP_RETH_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-reth:v2.8.0}
  restart: unless-stopped
  stop_grace_period: 5m
  depends_on:
    jwt:
      condition: service_completed_successfully

x-supernode: &supernode
  image: ${OP_SUPERNODE_IMAGE:-us-docker.pkg.dev/oplabs-tools-artifacts/images/op-supernode:v1.1.0}
  entrypoint: [op-supernode]
  restart: unless-stopped
  stop_grace_period: 1m

services:
  # Writes a shared engine API secret on first start.
  jwt:
    image: alpine:3.20
    command: sh -c '[ -s /jwt/jwt.hex ] || head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > /jwt/jwt.hex'
    volumes:
      - ${DATA_DIR:-./data}/jwt:/jwt

  # ---------------------------------------------------------------- mainnet

  op-mainnet-reth:
    <<: *reth
    profiles: [mainnet]
    command: >
      node --chain optimism --full --datadir /data
      --http --http.addr 0.0.0.0 --http.port 8545 --http.api eth,net,web3,txpool
      --authrpc.addr 0.0.0.0 --authrpc.port 8551 --authrpc.jwtsecret /jwt/jwt.hex
      --port 30303 --discovery.port 30303 --enable-discv5-discovery
      --bootnodes enode://ca2774c3c401325850b2477fd7d0f27911efbf79b1e8b335066516e2bd8c4c9e0ba9696a94b1cb030a88eac582305ff55e905e64fb77fe0edcd70a4e5296d3ec@34.65.175.185:30305,enode://dd751a9ef8912be1bfa7a5e34e2c3785cc5253110bd929f385e07ba7ac19929fb0e0c5d93f77827291f4da02b2232240fbc47ea7ce04c46e333e452f8656b667@34.65.107.0:30305,enode://c5d289b56a77b6a2342ca29956dfd07aadf45364dde8ab20d1dc4efd4d1bc6b4655d902501daea308f4d8950737a4e93a4dfedd17b49cd5760ffd127837ca965@34.65.202.239:30305,enode://d860a01f9722d78051619d1e2351aba3f43f943f6f00718d1b9baa4101932a1f5011f16bb2b1bb35db20d6fe28fa0bf09636d26a87d31de9ec6203eeedb1f666@18.138.108.67:30303,enode://22a8232c3abc76a16ae9d6c3b164f98775fe226f0917b0ca871128a74a8e9630b458460865bab457221f1d448dd9791d24c4e5d88786180ac185df813a68d4de@3.209.45.79:30303,enode://2b252ab6a1d0f971d9722cb839a42cb81db019ba44c08754628ab4a823487071b5695317c8ccd085219c3a03af063495b2f1da8d18218da2d6a82981b45e6ffc@65.108.70.101:30303,enode://4aeb4ab6c14b23e2c4cfdce879c04b0748a20d8e9b59e25ded2a08143e265c6c25936e74cbc8e641e3312ca288673d91f2f93f8e277de3cfa444ecdaaf982052@157.90.35.166:30303
